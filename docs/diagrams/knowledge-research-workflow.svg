<g transform="translate(260 244)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#34D399"/><text x="34" y="34" fill="#34D399" font-size="13" font-weight="700" letter-spacing="2">01</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">knowledge-research</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Orchestrate source ingestion, academic research, product decisions, personal knowledge</tspan><tspan x="102" dy="18">retrieval, and evidence-backed memory feedback.</tspan></text></g><g transform="translate(260 370)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#34D399"/><text x="34" y="34" fill="#34D399" font-size="13" font-weight="700" letter-spacing="2">02</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">document-to-markdown</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Convert PDF, Office, HTML, images, and audio into structured Markdown while preserving</tspan><tspan x="102" dy="18">headings, tables, links, and provenance where possible.</tspan></text></g><g transform="translate(260 496)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#34D399"/><text x="34" y="34" fill="#34D399" font-size="13" font-weight="700" letter-spacing="2">03</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">academic-research</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Plan literature reviews, search and evaluate sources, synthesize evidence, draft research</tspan><tspan x="102" dy="18">writing, and perform peer-review-style critique.</tspan></text></g><g transform="translate(260 622)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#34D399"/><text x="34" y="34" fill="#34D399" font-size="13" font-weight="700" letter-spacing="2">04</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">product-strategy</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Support product discovery, market research, positioning, prioritization, execution planning,</tspan><tspan x="102" dy="18">go-to-market, and product analytics.</tspan></text></g><g transform="translate(260 748)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#34D399"/><text x="34" y="34" fill="#34D399" font-size="13" font-weight="700" letter-spacing="2">05</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">solo-business-operations</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Plan and operate a one-person business across product, content, finance, operations, legal</tspan><tspan x="102" dy="18">coordination, customer support, and engineering.</tspan></text></g><g transform="translate(260 874)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#34D399"/><text x="34" y="34" fill="#34D399" font-size="13" font-weight="700" letter-spacing="2">06</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">personal-knowledge-memory</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Retrieve relevant personal project decisions, playbooks, knowledge, skills, and verified</tspan><tspan x="102" dy="18">outcomes before important work, then record only knowledge that materially affected the…</tspan></text></g>
<text x="92" y="1138" fill="#94A3B8" font-size="13">Editable SVG · neutral structure · one suite accent · no raster generation</text>
