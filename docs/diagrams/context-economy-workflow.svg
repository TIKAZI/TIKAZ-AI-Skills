<svg width="1440" height="1070" viewBox="0 0 1440 1070" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Context Economy workflow</title>
<desc id="desc">The suite orchestrator routes work through 4 independently installable specialist Skills.</desc>
<rect width="1440" height="1070" rx="24" fill="#080D18"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="92" y="84" fill="#60A5FA" font-size="14" font-weight="700" letter-spacing="3">TIKAZ AI SKILLS FOR CODEX</text>
<text x="92" y="138" fill="#F8FAFC" font-size="40" font-weight="720">Context Economy workflow</text>
<text x="92" y="176" fill="#CBD5E1" font-size="18">Install the suite for orchestration, or use any specialist on its own.</text>
<path d="M126 287 V791" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="126" cy="287" r="11" fill="#60A5FA"/>
<path d="M126 287 H260" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 413 H260" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 539 H260" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 665 H260" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 791 H260" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round"/>
<g transform="translate(260 244)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#60A5FA"/><text x="34" y="34" fill="#60A5FA" font-size="13" font-weight="700" letter-spacing="2">01</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">context-economy</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Automatically prepare fidelity-first, bounded context when users paste text, attach files or</tspan><tspan x="102" dy="18">folders, provide PDFs for Markdown conversion, continue long conversations, or supply…</tspan></text></g><g transform="translate(260 370)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#60A5FA"/><text x="34" y="34" fill="#60A5FA" font-size="13" font-weight="700" letter-spacing="2">02</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">context-pack</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Prepare files, folders, code, logs, and structured data as a bounded, traceable context pack</tspan><tspan x="102" dy="18">for Codex.</tspan></text></g><g transform="translate(260 496)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#60A5FA"/><text x="34" y="34" fill="#60A5FA" font-size="13" font-weight="700" letter-spacing="2">03</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">conversation-checkpoint</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Use when a long or repetitive conversation has no source file and must be converted into a</tspan><tspan x="102" dy="18">recoverable task state before continuation, handoff, or compaction.</tspan></text></g><g transform="translate(260 622)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#60A5FA"/><text x="34" y="34" fill="#60A5FA" font-size="13" font-weight="700" letter-spacing="2">04</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">context-audit</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Diagnose context relevance, redundancy, traceability, safety, cacheability, and</tspan><tspan x="102" dy="18">recoverability.</tspan></text></g><g transform="translate(260 748)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#60A5FA"/><text x="34" y="34" fill="#60A5FA" font-size="13" font-weight="700" letter-spacing="2">05</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">context-benchmark</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Measure context preparation across fixed cases.</tspan></text></g>
<text x="92" y="1012" fill="#94A3B8" font-size="13">Editable SVG · neutral structure · one suite accent · no raster generation</text>
</g>
</svg>