<path d="M126 287 H260" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 413 H260" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 539 H260" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 665 H260" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 791 H260" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 917 H260" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round"/>
<g transform="translate(260 244)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#A78BFA"/><text x="34" y="34" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="2">01</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">engineering</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Orchestrate production software delivery through specification, repository intelligence,</tspan><tspan x="102" dy="18">implementation, testing, security review, data operations, and release evidence.</tspan></text></g><g transform="translate(260 370)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#A78BFA"/><text x="34" y="34" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="2">02</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">code-intelligence</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Understand repositories as systems: map code structure and semantic relationships, analyze</tspan><tspan x="102" dy="18">change impact, review pull requests, and plan safe refactors.</tspan></text></g><g transform="translate(260 496)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#A78BFA"/><text x="34" y="34" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="2">03</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">engineering-delivery</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Run production software work from specification through planning, implementation, testing,</tspan><tspan x="102" dy="18">review, and release.</tspan></text></g><g transform="translate(260 622)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#A78BFA"/><text x="34" y="34" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="2">04</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">skill-security-audit</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Statically inspect third-party agent skills before installation for prompt injection,</tspan><tspan x="102" dy="18">destructive commands, credential access, dependency risk, hidden network behavior, and unsafe…</tspan></text></g><g transform="translate(260 748)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#A78BFA"/><text x="34" y="34" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="2">05</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">supabase-operations</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Design, deploy, and operate Supabase projects with explicit schema, migration, security,</tspan><tspan x="102" dy="18">backup, and observability checks.</tspan></text></g><g transform="translate(260 874)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#A78BFA"/><text x="34" y="34" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="2">06</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">video-workbench</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Engineer repository-backed media processing workbenches across ingestion, job state,</tspan><tspan x="102" dy="18">processing, review, export, frontend states, QA evidence, and deployment configuration.</tspan></text></g>
<text x="92" y="1138" fill="#94A3B8" font-size="13">Editable SVG · neutral structure · one suite accent · no raster generation</text>
</g>
</svg>