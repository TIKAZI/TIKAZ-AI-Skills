<svg width="1440" height="944" viewBox="0 0 1440 944" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Presentation Workflows workflow</title>
<desc id="desc">The suite orchestrator routes work through 3 independently installable specialist Skills.</desc>
<rect width="1440" height="944" rx="24" fill="#080D18"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="92" y="84" fill="#F59E0B" font-size="14" font-weight="700" letter-spacing="3">TIKAZ AI SKILLS FOR CODEX</text>
<text x="92" y="138" fill="#F8FAFC" font-size="40" font-weight="720">Presentation Workflows workflow</text>
<text x="92" y="176" fill="#CBD5E1" font-size="18">Install the suite for orchestration, or use any specialist on its own.</text>
<path d="M126 287 V665" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="126" cy="287" r="11" fill="#F59E0B"/>
<path d="M126 287 H260" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 413 H260" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 539 H260" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M126 665 H260" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round"/>
<g transform="translate(260 244)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#F59E0B"/><text x="34" y="34" fill="#F59E0B" font-size="13" font-weight="700" letter-spacing="2">01</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">presentation</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Route and govern presentation creation across browser-editable HTML decks, native editable</tspan><tspan x="102" dy="18">PowerPoint, and magazine-style web decks.</tspan></text></g><g transform="translate(260 370)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#F59E0B"/><text x="34" y="34" fill="#F59E0B" font-size="13" font-weight="700" letter-spacing="2">02</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">html-deck-builder</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Plan and build browser-editable HTML presentations with narrative contracts, responsive slide</tspan><tspan x="102" dy="18">layouts, keyboard navigation, offline-safe assets, and render verification.</tspan></text></g><g transform="translate(260 496)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#F59E0B"/><text x="34" y="34" fill="#F59E0B" font-size="13" font-weight="700" letter-spacing="2">03</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">powerpoint-deck-builder</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Plan, create, revise, and verify native editable PowerPoint presentations with source-aware</tspan><tspan x="102" dy="18">content, reusable layouts, speaker notes, and rendered visual QA.</tspan></text></g><g transform="translate(260 622)"><rect width="1040" height="86" rx="16" fill="#101827" stroke="#334155"/><rect width="6" height="86" rx="3" fill="#F59E0B"/><text x="34" y="34" fill="#F59E0B" font-size="13" font-weight="700" letter-spacing="2">04</text><text x="102" y="37" fill="#F8FAFC" font-size="23" font-weight="700">magazine-web-deck</text><text x="102" y="58" fill="#94A3B8" font-size="14"><tspan x="102" dy="0">Create editorial or Swiss-inspired single-file web presentations with strong typographic</tspan><tspan x="102" dy="18">hierarchy, horizontal navigation, responsive composition, and restrained motion.</tspan></text></g>
<text x="92" y="886" fill="#94A3B8" font-size="13">Editable SVG · neutral structure · one suite accent · no raster generation</text>
