schema_version: 2
maintainer: TIKAZ
repository_license: MIT
policy: >-
  The release tree contains TIKAZ-authored original, clean-room, and adapter
  material. Research references are acknowledged but not redistributed.
  Unknown-license, noncommercial, or incompatible vendored content fails the
  release gate.

