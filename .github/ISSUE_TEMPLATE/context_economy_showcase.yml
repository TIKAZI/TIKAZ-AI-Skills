name: Context Economy user story
description: Share a reproducible public or sanitized result for possible inclusion as adoption evidence.
title: "[Context Economy story]: "
labels: [feedback]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Run tikaz-context --version or provide the exact commit SHA.
      placeholder: 0.10.0
    validations: {required: true}
  - type: dropdown
    id: route
    attributes:
      label: Route used
      options: [Text, Hybrid, Source, Checkpoint, Prompt Exact, Prompt Structural, Mixed or unknown]
    validations: {required: true}
  - type: textarea
    id: task
    attributes:
      label: Task and sanitized input profile
      description: Describe the real task, file types, approximate size, and any images or complex tables. Do not upload private material.
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction command or prompt
      description: Include a minimal command or Skill prompt and link public or sanitized fixtures when possible.
      render: shell
    validations: {required: true}
  - type: textarea
    id: measurements
    attributes:
      label: Before and after measurements
      description: Separate bytes, estimated tokens, provider telemetry, latency, and visual items. State how each value was measured.
    validations: {required: true}
  - type: textarea
    id: fidelity
    attributes:
      label: Fidelity checks and limitations
      description: List protected facts, anchors, table cells, pending visuals, omissions, failures, and anything not verified.
    validations: {required: true}
  - type: checkboxes
    id: consent
    attributes:
      label: Publication consent
      options:
        - label: The material is public or safely sanitized and may be linked from project documentation with attribution.
          required: true
        - label: I understand that maintainers will verify the result before treating it as adoption evidence.
          required: true
