name: Context Economy 用户案例（中文）
description: 分享可复现的公开或脱敏结果，核验后可作为真实采用证据。
title: "[Context Economy 案例][中文]: "
labels: [feedback]
body:
  - type: input
    id: version
    attributes:
      label: 版本或 Commit
      description: 运行 tikaz-context --version，或提供准确 Commit SHA。
      placeholder: 0.10.0
    validations: {required: true}
  - type: dropdown
    id: route
    attributes:
      label: 使用的路线
      options: [Text, Hybrid, Source, Checkpoint, Prompt Exact, Prompt Structural, 混合或不确定]
    validations: {required: true}
  - type: textarea
    id: task
    attributes:
      label: 任务与脱敏输入画像
      description: 描述真实任务、文件类型、大致体积，以及是否含图片或复杂表格；不要上传私人材料。
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes:
      label: 复现命令或提示词
      description: 提供最小命令或 Skill 提示词；可以公开时请链接脱敏固定样例。
      render: shell
    validations: {required: true}
  - type: textarea
    id: measurements
    attributes:
      label: 处理前后数据
      description: 分开填写字节、估算 Token、Provider 遥测、延迟与视觉项，并说明每项如何测量。
    validations: {required: true}
  - type: textarea
    id: fidelity
    attributes:
      label: 保真检查与限制
      description: 列出受保护事实、锚点、表格单元格、待处理图片、遗漏、失败和未验证项。
    validations: {required: true}
  - type: checkboxes
    id: consent
    attributes:
      label: 发布授权
      options:
        - label: 材料已经公开或安全脱敏，可以署名链接到项目文档。
          required: true
        - label: 我理解维护者核验后才会把它作为采用证据。
          required: true
